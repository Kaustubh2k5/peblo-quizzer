worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zones ──────────────────────────────────────────
    # General API: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # Ingest endpoint: 5 uploads/minute per IP (PDF uploads are heavy)
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=5r/m;

    # ── Logging ──────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    server_tokens off;

    # ── Upload size limit (match MAX_FILE_SIZE_MB in .env) ───────────
    client_max_body_size 25M;

    # ── Timeouts ─────────────────────────────────────────────────────
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Health check (no rate limit) ─────────────────────────────
        location /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── PDF ingest (strict rate limit) ───────────────────────────
        location /api/ingest {
            limit_req zone=ingest_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── All other API routes ──────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
